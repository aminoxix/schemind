name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test:run

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test schemind-py (core + adapter)
        working-directory: packages/py
        run: PYTHONPATH=src python3 -m unittest discover -s tests -v

  go-adapter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Test schemind-go adapter
        working-directory: adapters/schemind-go
        run: go test ./...

      - name: Build Go example backend
        working-directory: examples/backend-go
        run: go build ./...

  java-adapter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
          cache: maven

      - name: Build & install schemind-java adapter
        working-directory: adapters/schemind-java
        run: mvn -q install

      - name: Build & test Java example backend
        working-directory: examples/backend-java
        run: mvn -q test
